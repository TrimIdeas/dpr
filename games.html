
<style>
    .games-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 10px;
        box-sizing: border-box;
    }

    .game-container {
        width: 100%;
        aspect-ratio: 4 / 3;
        position: relative;
    }

    .game-frame {
        width: 100%;
        height: 100%;
        border: none;
    }

    .fullscreen-btn {
        position: absolute;
        bottom: 10px;
        right: 10px;
        z-index: 2;
    }

    @media (max-width: 600px) {
        .games-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>
